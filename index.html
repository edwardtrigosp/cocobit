<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Únete a Cocobit</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{ box-sizing: border-box; }
html, body{ margin: 0; min-height: 100%; }
body{
  font-family: 'Fredoka', system-ui, sans-serif;
  background: #E6F6F4;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 1rem;
}
.jt-wrap{ width: 100%; max-width: 960px; }
.jt-card{
  position: relative;
  width: 100%;
  min-height: 300px;
  padding: 2.5rem 2.5rem 5rem;
  border-radius: 20px;
  background: #F6E3B4;
  overflow: hidden;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
}
.jt-waves{
  position: absolute;
  left: 0; bottom: 0;
  width: 100%;
  height: 64px;
  z-index: 0;
}
.jt-circle{
  position: absolute;
  bottom: -20px;
  left: 50%;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #0B4F5C;
  transform: translateX(-50%) scale(0);
  transition: transform 1.1s ease-in-out;
  z-index: 0;
}
.jt-card:hover .jt-circle,
.jt-card:focus-within .jt-circle{
  transform: translateX(-50%) scale(120);
}
.jt-coco{
  position: absolute;
  right: 5%;
  bottom: 28px;
  width: clamp(130px, 24vw, 210px);
  height: auto;
  z-index: 1;
  transform-origin: 50% 90%;
  transition: transform 0.9s ease-in-out;
}
.jt-card:hover .jt-coco,
.jt-card:focus-within .jt-coco{
  transform: rotate(-7deg) translateY(-6px);
}
.jt-content{
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 22px;
  width: 100%;
}
.jt-title{
  font-size: clamp(38px, 7.5vw, 58px);
  font-weight: 700;
  line-height: 1.05;
  margin: 0;
  color: #0B4F5C;
  transition: color 0.9s ease-in-out;
}
button.jt-btn{
  appearance: none;
  -webkit-appearance: none;
  display: flex;
  align-items: center;
  gap: 12px;
  border: none;
  border-radius: 999px;
  background: rgba(255,255,255,0.65);
  padding: 12px 8px 12px 20px;
  font-family: 'Fredoka', sans-serif;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: background 0.9s ease-in-out;
}
button.jt-btn:focus-visible{
  outline: 3px solid #0B4F5C;
  outline-offset: 3px;
}
.jt-btn-text{
  color: #0B4F5C;
  transition: color 0.9s ease-in-out;
}
.jt-arrow{
  width: 32px;
  height: 32px;
  min-width: 32px;
  border-radius: 50%;
  background: #FF7A59;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  transition: background 0.9s ease-in-out, color 0.9s ease-in-out;
}
.jt-arrow svg{ width: 18px; height: 18px; }
.jt-card:hover .jt-title,
.jt-card:focus-within .jt-title,
.jt-card:hover .jt-btn-text,
.jt-card:focus-within .jt-btn-text{
  color: #ffffff;
}
.jt-card:hover button.jt-btn,
.jt-card:focus-within button.jt-btn{
  background: rgba(255,255,255,0.18);
}
.jt-card:hover .jt-arrow,
.jt-card:focus-within .jt-arrow{
  background: #ffffff;
  color: #FF7A59;
}
@media (max-width: 560px){
  .jt-card{ padding: 1.5rem 1.5rem 5rem; min-height: 340px; }
  .jt-coco{ width: 110px; right: 14px; bottom: auto; top: 14px; }
  .jt-title{ max-width: 60%; }
}
@media (prefers-reduced-motion: reduce){
  .jt-circle, .jt-title, .jt-btn-text, button.jt-btn, .jt-arrow, .jt-coco{ transition-duration: 0.01s; }
  .jt-card:hover .jt-coco, .jt-card:focus-within .jt-coco{ transform: none; }
}
</style>
</head>
<body>
<main class="jt-wrap">
  <div class="jt-card">
    <svg class="jt-waves" viewBox="0 0 1200 80" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 40 C150 10 300 10 450 40 S750 70 900 40 S1100 10 1200 40 V80 H0 Z" fill="#8EDAD4"/>
      <path d="M0 56 C150 30 300 30 450 56 S750 82 900 56 S1100 30 1200 56 V80 H0 Z" fill="#19B5B0"/>
    </svg>
    <div class="jt-circle"></div>
    <svg class="jt-coco" viewBox="0 0 230 232" role="img" aria-label="Un coco sonriente con una pajilla">
      <circle cx="192" cy="34" r="22" fill="#FFC93C"/>
      <path d="M110 72 C70 30 25 40 8 78 C45 58 80 62 110 72 Z" fill="#2E9E5B"/>
      <path d="M110 72 C150 30 195 40 212 78 C175 58 140 62 110 72 Z" fill="#1F7A45"/>
      <path d="M110 74 C92 38 102 12 110 0 C120 14 130 40 110 74 Z" fill="#37B26B"/>
      <path d="M128 100 L168 24" stroke="#FF7A59" stroke-width="9" stroke-linecap="round"/>
      <path d="M128 100 L168 24" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 10"/>
      <circle cx="110" cy="150" r="68" fill="#8B5A2B"/>
      <ellipse cx="80" cy="115" rx="20" ry="11" fill="#A9743F" transform="rotate(-30 80 115)"/>
      <circle cx="90" cy="140" r="6" fill="#3B2314"/>
      <circle cx="130" cy="140" r="6" fill="#3B2314"/>
      <path d="M92 162 Q110 178 128 162" fill="none" stroke="#3B2314" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <div class="jt-content">
      <h1 class="jt-title">Únete a<br>Cocobit.</h1>
      <button class="jt-btn" type="button">
        <span class="jt-btn-text">Explora nuestras oportunidades laborales</span>
        <span class="jt-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </button>
    </div>
  </div>
</main>
</body>
</html>
